repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=88"]
        stages: [post-commit]
        additional_dependencies: [black]
  
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: ["--fix"]
        stages: [post-commit]
      - id: ruff-format
        stages: [post-commit]
  
  - repo: local
    hooks:
      - id: auto-amend-after-format
        name: Auto-amend commit with formatter changes
        # Якщо після форматтерів залишились незакомічені зміни, додаємо їх і
        # робимо amend до щойно створеного комміту (без повторного запуску хуків).
        entry: bash -lc 'if [ -n "$(git status --porcelain)" ]; then git add -A && git commit --amend --no-edit --no-verify; fi'
        language: system
        stages: [post-commit]
        always_run: true


