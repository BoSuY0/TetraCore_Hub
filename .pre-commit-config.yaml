repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=88"]
        stages: [commit]
        additional_dependencies: [black]
  
  - repo: local
    hooks:
      - id: git-add-after-black
        name: Git add after black
        entry: bash -c 'git add .'
        language: system
        stages: [post-commit]
        always_run: true


