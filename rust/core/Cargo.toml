[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
dashmap = "5"
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
http = "1"
models = { path = "../models" }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
